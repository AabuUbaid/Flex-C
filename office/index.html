<!doctype html>
<html lang="en" data-app="office">
<head>
<meta charset="utf-8">
<script>try{if(localStorage.getItem('fc_bw')==='1')document.documentElement.classList.add('bw')}catch(e){}</script>
<script>try{var t=localStorage.getItem('fc_theme');if(t!=='dark'&&t!=='light')t=matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light';document.documentElement.dataset.theme=t}catch(e){}</script>
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="../assets/icons/office-32.png" type="image/png">
<link rel="apple-touch-icon" href="../assets/icons/office-apple.png">
<meta name="theme-color" content="#4338ca">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Flex-C Office">
<title>Flex-C Back Office</title>
<link rel="stylesheet" href="../assets/app.css?v=498d606380">

</head>
<body>
<header class="top">
  <span class="brandmark">F</span><b>Flex-C</b>
  <a href="../dashboard/">Dashboard</a><a class="on" href="./">Back office</a><a href="../pos/">POS</a>
  <span class="sp"></span><small id="who"></small><button id="out">Sign out</button>
</header>
<div class="wrap shell">
  <aside id="side">
    <button type="button" id="sideTog" class="sidetog" aria-label="Open menu"><span class="bars">&#9776;</span> <b id="sideCur">Menu</b> <span class="chev">&#9662;</span></button>
    <div class="sidebody">
      <div class="co"><label>Company</label><select id="co"></select></div>
      <div class="msearch"><input id="menuQ" type="search" placeholder="Search menu (press /)" autocomplete="off" aria-label="Search menu"><div class="mall"><button type="button" id="mOpen">Expand all</button><button type="button" id="mShut">Collapse all</button></div></div>
      <nav class="tabs" id="tabs"></nav>
    </div>
  </aside>
  <main id="main"><div id="view"></div></main>
  <datalist id="dl"></datalist>
</div>
<div id="printArea"></div>
<script src="../assets/icons.js?v=b59449fc8d"></script>
<script src="../assets/scan.js?v=f88b94a03b"></script>
<script src="../assets/barcode.js?v=1aee91e66f"></script>
<script src="../assets/qr.js?v=d3461c1385"></script>
<script src="../assets/stocktake.js?v=ec86ebfce7"></script>
<script src="../assets/app.js?v=52d847de3f"></script>
<script>
let CO = 0, TAB = 'suppliers', ITEMS = [], LEDGER_ITEM = 0, SETTINGS = null;
const view = () => $('#view');
const isEditor = () => ['owner', 'manager'].includes(S.user.role);
const isOffice = () => ['owner', 'manager', 'accountant'].includes(S.user.role);
const shopsOf = () => (S.org.shops || []).filter((s) => s.company_id === CO);
const shopOpts = (all) => (all ? '<option value="">All shops</option>' : '') + shopsOf().map((s) => `<option value="${s.id}">${esc(s.name)} (${esc(s.code)})</option>`).join('');
const itemKey = (i) => i.sku + ' — ' + i.name;
const findItem = (t) => { const k = String(t).trim().toLowerCase(), z = /^\d+$/.test(k) ? k.replace(/^0+/, '') : null;
  return ITEMS.find((i) => itemKey(i) === t) || ITEMS.find((i) => i.sku.toLowerCase() === k) || ITEMS.find((i) => (i.barcodes || []).some((b) => String(b).toLowerCase() === k))
    || (z ? ITEMS.find((i) => (i.barcodes || []).some((b) => /^\d+$/.test(b) && String(b).replace(/^0+/, '') === z)) : undefined); };   // 000000016587 = 16587
// A search box above a <select> (supplier lists): typing hides options that do not match and picks the first match.
function findSelect(id, what) {
  const sel = document.getElementById(id); if (!sel || sel.dataset.fs) return; sel.dataset.fs = '1';
  const inp = document.createElement('input'); inp.type = 'search'; inp.placeholder = 'Type to find ' + (what || 'supplier'); inp.autocomplete = 'off'; inp.style.marginBottom = '4px';
  sel.parentNode.insertBefore(inp, sel);
  inp.oninput = () => {
    const q = inp.value.trim().toLowerCase(); let first = null;
    [...sel.options].forEach((o) => { const hit = !q || o.text.toLowerCase().includes(q); o.hidden = !hit; o.disabled = !hit && !!o.value; if (hit && !first) first = o; });
    if (first && (sel.selectedOptions[0] || {}).hidden !== false) sel.value = first.value;
    if (first && sel.selectedOptions[0] && sel.selectedOptions[0].hidden) sel.value = first.value;
  };
}
const msg = (el, text, ok) => { el.className = ok ? 'okmsg' : 'err'; el.textContent = text; };
const tagLevel = (l) => l === 'bad' ? 'bad' : l === 'warn' ? 'warn' : 'ok';
const ROLE_LABEL = { owner: 'Owner / sub-owner', manager: 'Manager', accountant: 'Accountant', cashier: 'Cashier', purchase: 'Purchase team', stocker: 'Stocker (stock take only)' };
const ROLES = [['owner', 'Sub-owner (all controls)'], ['manager', 'Manager'], ['accountant', 'Accountant'], ['cashier', 'Cashier'], ['purchase', 'Purchase team'], ['stocker', 'Stocker (stock take only)']];
async function loadItems() {
  ITEMS = (await api('items_list', { params: { company_id: CO } })).items;
  $('#dl').innerHTML = ITEMS.map((i) => `<option value="${esc(itemKey(i))}">`).join('');
}
async function settings() {
  if (SETTINGS) return SETTINGS;
  try { SETTINGS = (await api('settings_get')).settings; } catch (e) { SETTINGS = S.settings || { currency: 'AED' }; }
  return SETTINGS;
}

const TAB_DEFS = {
  // Menu in working order: suppliers -> purchase -> items -> stock -> sales -> accounts -> expenses -> reports -> settings
  suppliers: { group: 'Suppliers', label: 'Suppliers & payments', roles: ['owner', 'manager', 'accountant', 'purchase'], fn: tSuppliers },
  purchases: { group: 'Purchase', label: 'Purchases', roles: ['owner', 'manager', 'accountant', 'purchase'], fn: tPurchases },
  sreturns: { group: 'Purchase', label: 'Purchase returns', roles: ['owner', 'manager', 'accountant', 'purchase'], fn: tSReturns },
  items: { group: 'Items', label: 'Item master (scan)', roles: ['owner', 'manager', 'accountant', 'purchase'], fn: tItems },
  labels: { group: 'Items', label: 'Barcode labels', roles: ['owner', 'manager', 'accountant', 'purchase'], fn: tLabels },
  barhist: { group: 'Items', label: 'Barcode history', roles: ['owner', 'manager', 'accountant', 'purchase'], fn: tBarHist },
  stock: { group: 'Stock', label: 'Stock levels & transfers', roles: ['owner', 'manager', 'accountant', 'purchase'], fn: tStock },
  take: { group: 'Stock', label: 'Stock take (team)', roles: ['owner', 'manager', 'stocker'], fn: tTake },
  scan: { group: 'Stock', label: 'Scan stock (phone)', roles: ['owner', 'manager'], fn: tScanCount },
  import: { group: 'Stock', label: 'Import stock (Excel)', roles: ['owner', 'manager'], fn: tImport },
  reports: { group: 'Sales', label: 'Sales report', roles: ['owner', 'manager', 'accountant'], fn: tReports },
  returns: { group: 'Sales', label: 'Sales returns', roles: ['owner', 'manager', 'accountant'], fn: tReturns },
  customers: { group: 'Sales', label: 'Customers', roles: ['owner', 'manager', 'accountant'], fn: tCustomers },
  closings: { group: 'Accounts', label: 'Cash-ups', roles: ['owner', 'manager', 'accountant'], fn: tClosings },
  vat: { group: 'Accounts', label: 'VAT return', roles: ['owner', 'manager', 'accountant'], fn: tVat },
  checks: { group: 'Accounts', label: 'Checks', roles: ['owner', 'manager', 'accountant'], fn: tChecks },
  expenses: { group: 'Expenses', label: 'Expenses', roles: ['owner', 'manager', 'accountant'], fn: tExpenses },
  profit: { group: 'Reports', label: 'Profit summary (monthly)', roles: ['owner', 'manager', 'accountant'], fn: tProfit },
  stockrep: { group: 'Reports', label: 'Stock report', roles: ['owner', 'manager', 'accountant', 'purchase'], fn: tStockReport },
  ledger: { group: 'Reports', label: 'Stock record', roles: ['owner', 'manager', 'accountant', 'purchase'], fn: tLedger },
  notifications: { group: 'Reports', label: 'Alerts', roles: ['owner', 'manager', 'accountant', 'purchase'], fn: tNotifications },
  users: { group: 'Settings', label: 'Users', roles: ['owner', 'manager'], fn: tUsers },
  company: { group: 'Settings', label: 'Company', roles: ['owner', 'manager', 'accountant'], fn: tCompany },
  settings: { group: 'Settings', label: 'Preferences & logos', roles: ['owner', 'manager'], fn: tSettings },
  backup: { group: 'Settings', label: 'Backup and export', roles: ['owner', 'accountant'], fn: tBackup },
};
function allowedTabs() { return Object.entries(TAB_DEFS).filter(([, v]) => v.roles.includes(S.user.role)); }
const ORDER = Object.keys(TAB_DEFS);
const GROUPS = ['Suppliers', 'Purchase', 'Items', 'Stock', 'Sales', 'Accounts', 'Expenses', 'Reports', 'Settings'];
const GCOL = { 'Suppliers': '#b45309', 'Purchase': '#c2410c', 'Items': '#047857', 'Stock': '#0f766e', 'Sales': '#0369a1', 'Accounts': '#6d28d9', 'Expenses': '#be123c', 'Reports': '#1d4ed8', 'Settings': '#475569' };
let MENU_Q = '';
const collapsed = (() => { try { return new Set(JSON.parse(localStorage.getItem('fc_menu_closed') || '[]')); } catch (e) { return new Set(); } })();
const saveCollapsed = () => { try { localStorage.setItem('fc_menu_closed', JSON.stringify([...collapsed])); } catch (e) { /* ignore */ } };
function drawTabs() {
  const list = allowedTabs();
  if (!list.some(([k]) => k === TAB)) TAB = list.length ? list[0][0] : 'items';
  const q = MENU_Q.trim().toLowerCase();
  const curGroup = TAB_DEFS[TAB] && TAB_DEFS[TAB].group;
  $('#tabs').innerHTML = GROUPS.map((g) => {
    const items = list.filter(([, v]) => v.group === g && (!q || v.label.toLowerCase().includes(q) || g.toLowerCase().includes(q))).sort((a, b) => ORDER.indexOf(a[0]) - ORDER.indexOf(b[0]));
    if (!items.length) return '';
    const shut = !q && collapsed.has(g), st = ` style="--gc:${GCOL[g] || '#475569'}"`;
    return `<button type="button" class="grp${shut ? ' shut' : ''}" data-g="${g}" aria-expanded="${!shut}"${st}><span>${g} <em>${items.length}</em></span><i>&#9662;</i></button>` +
      (shut ? '' : items.map(([k, v]) => `<button data-t="${k}" class="sub${k === TAB ? ' on' : ''}"${st}>${v.label}</button>`).join(''));
  }).join('') || '<div class="hint" style="padding:8px 10px">No menu matches.</div>';
  const cur = TAB_DEFS[TAB]; $('#sideCur').textContent = cur ? cur.label : '';
}
async function show() {
  if (TAB_DEFS[TAB] && collapsed.delete(TAB_DEFS[TAB].group)) saveCollapsed();   // opening a page opens its group
  drawTabs();
  if (location.hash.slice(1) !== TAB) history.replaceState(null, '', '#' + TAB);
  view().innerHTML = '<div class="card">Loading...</div>';
  try { await TAB_DEFS[TAB].fn(); hydrateIcons(view()); } catch (e) { view().innerHTML = `<div class="card err">${esc(niceErr(e))}</div>`; }
}
$('#tabs').addEventListener('click', (e) => { const b = e.target.closest('[data-t]'); if (b) { TAB = b.dataset.t; $('#side').classList.remove('open'); show(); window.scrollTo(0, 0); } });
$('#tabs').addEventListener('click', (e) => { const g = e.target.closest('[data-g]'); if (!g) return; const n = g.dataset.g; if (collapsed.has(n)) collapsed.delete(n); else collapsed.add(n); saveCollapsed(); drawTabs(); });
$('#mOpen').onclick = () => { collapsed.clear(); saveCollapsed(); drawTabs(); };
$('#mShut').onclick = () => { GROUPS.forEach((g) => collapsed.add(g)); saveCollapsed(); drawTabs(); };
$('#menuQ').addEventListener('input', (e) => { MENU_Q = e.target.value; drawTabs(); });
$('#menuQ').addEventListener('keydown', (e) => {
  if (e.key === 'Escape') { e.target.value = ''; MENU_Q = ''; drawTabs(); }
  if (e.key === 'Enter') { const b = $('#tabs [data-t]'); if (b) { TAB = b.dataset.t; e.target.value = ''; MENU_Q = ''; $('#side').classList.remove('open'); show(); } }
});
addEventListener('keydown', (e) => { if (e.key === '/' && !/^(INPUT|TEXTAREA|SELECT)$/.test((document.activeElement || {}).tagName || '')) { e.preventDefault(); $('#side').classList.add('open'); $('#menuQ').focus(); } });
$('#sideTog').onclick = () => $('#side').classList.toggle('open');
$('#co').addEventListener('change', (e) => { CO = +e.target.value; SETTINGS = null; show(); });
$('#out').onclick = signOut;
addEventListener('hashchange', () => {
  const h = location.hash.slice(1);
  if (TAB_DEFS[h] && TAB_DEFS[h].roles.includes(S.user.role) && h !== TAB) { TAB = h; show(); }
});

/* ---------------- Items ---------------- */
async function tItems() {
  await loadItems();
  const edit = isEditor();
  const samples = ITEMS.filter((i) => /^SAMPLE-[123]$/.test(i.sku) && /^Sample item /.test(i.name) && +i.active);
  view().innerHTML = `${edit && samples.length ? `<div class="card" style="border-left:5px solid #b45309"><b>${samples.length} sample item(s)</b> from the installation (Sample item 1, 2, 3) are still in your items and on the POS.
    <button class="btn sec" id="i_rmsamp" style="margin-left:8px">Remove sample items</button><div class="hint">Removed completely if never sold or bought; otherwise hidden from the POS. Then press Refresh on each POS.</div><div id="i_rmmsg"></div></div>` : ''}${edit ? `<div class="card" id="ms_card"></div>` : ''}${edit ? `<div class="card" id="i_card"><h3 id="i_h">Add item</h3><form id="f"><input type="hidden" id="i_id">
    <div class="grid g2">
      <div><label>SKU *</label><input id="i_sku" required maxlength="40"></div>
      <div><label>Name *</label><input id="i_name" required maxlength="200"></div>
      <div><label>Arabic name</label><input id="i_ar" dir="rtl" maxlength="200"></div>
      <div><label>Category</label><input id="i_cat" maxlength="80"></div>
      <div><label>Unit</label><input id="i_uom" value="pc" maxlength="10"></div>
      <div><label>Selling price (VAT incl.) *</label><input id="i_price" type="number" step="0.01" min="0" required></div>
      <div><label>Cost (ex VAT)</label><input id="i_cost" type="number" step="0.0001" min="0" value="0"></div>
      <div><label>VAT %</label><input id="i_vat" type="number" step="0.01" min="0" value="5"></div>
      <div><label>Reorder level (0 = default 10)</label><input id="i_re" type="number" step="0.001" min="0" value="0"></div>
      <div><label>Barcodes (comma separated)</label><div style="display:flex;gap:6px"><input id="i_bc" style="flex:1"><button type="button" class="btn sec" id="i_scan" data-ic="camera">Scan</button></div></div>
    </div>
    <label><input type="checkbox" id="i_act" checked style="width:auto"> Active (shown on the POS)</label>
    <div class="row" style="margin-top:10px"><div class="fit"><button class="btn">Save item</button></div><div class="fit"><button class="btn sec" type="button" id="i_new">Clear</button></div>${S.user.role === 'owner' ? '<div class="fit"><button class="btn sec" type="button" id="i_del" style="display:none;color:#b91c1c">Delete item</button></div>' : ''}</div>
    <div class="hint">Edit: owner and manager. Delete: owner only; an item that is on old bills cannot be deleted (VAT records need it), it is hidden from the POS instead.</div>
    <div id="i_msg"></div></form></div>` : `<div class="card"><span class="tag warn">View only</span> <span class="hint">Items are edited by owners and managers.</span></div>`}
    <div class="card"><div class="row"><div><label>Search</label><input id="i_q" placeholder="name, SKU or barcode"></div></div>
    <div class="tbl"><table id="i_tb"></table></div></div>`;
  const draw = (q) => {
    q = q.trim().toLowerCase();
    const list = ITEMS.filter((i) => !q || i.name.toLowerCase().includes(q) || i.sku.toLowerCase().includes(q) || (i.barcodes || []).some((b) => b.toLowerCase().includes(q)));
    $('#i_tb').innerHTML = `<tr><th>SKU</th><th>Name</th><th class="r">Price</th><th class="r">Cost</th><th class="r">VAT%</th><th class="r">Reorder</th><th>Barcodes</th>${edit ? '<th></th>' : ''}</tr>` +
      list.slice(0, 2000).map((i) => `<tr><td>${esc(i.sku)}</td><td>${esc(i.name)}${+i.active ? '' : ' <span class="tag bad">hidden</span>'}</td><td class="r">${money(i.price)}</td><td class="r">${money(i.cost)}</td><td class="r">${+i.vat_rate}</td><td class="r">${+i.reorder_level || ''}</td><td>${esc((i.barcodes || []).join(', '))}</td>${edit ? `<td style="white-space:nowrap"><button class="btn sec" data-e="${i.id}">Edit</button>${S.user.role === 'owner' ? ` <button class="btn sec" data-d="${i.id}" style="color:#b91c1c" title="Delete (owner)">Delete</button>` : ''}</td>` : ''}</tr>`).join('') + (list.length > 2000 ? '<tr><td colspan="8" class="hint">First 2000 shown; search to find others.</td></tr>' : '');
  };
  draw('');
  $('#i_q').oninput = (e) => draw(e.target.value);
  if (!edit) return;
  itemScanner(() => draw($('#i_q').value));
  if ($('#i_rmsamp')) $('#i_rmsamp').onclick = async () => {
    if (!confirm('Remove the 3 sample items (and their sample stock)?')) return;
    try { const r = await api('items_remove_samples', { body: { company_id: CO } }); await tItems(); msg($('#ms_msg') || $('#i_msg'), `Sample items: ${r.removed} removed, ${r.hidden} hidden. Press Refresh on each POS.`, true); } catch (e) { msg($('#i_rmmsg'), niceErr(e)); }
  };
  const clear = () => { $('#f').reset(); $('#i_id').value = ''; $('#i_act').checked = true; $('#i_h').textContent = 'Add item'; if ($('#i_del')) $('#i_del').style.display = 'none'; };
  $('#i_new').onclick = clear;
  // Owner: delete an item; one that is on old bills is hidden instead (after asking).
  const delItem = async (i) => {
    if (!confirm(`Delete "${i.name}" (${i.sku})? Its barcodes and its stock records are removed. This cannot be undone.`)) return;
    try {
      const r = await api('item_delete', { body: { company_id: CO, item_id: i.id } });
      await tItems(); msg($('#i_msg'), `Deleted ${i.name}${r.stock_was ? ' (stock was ' + r.stock_was + ')' : ''}. Press Refresh on each POS.`, true);
    } catch (err) {
      const [c, n] = String(err.message).split(':');
      if (c === 'item_used') {
        if (!confirm(`"${i.name}" is on ${n} bill line(s), so it cannot be deleted (old bills and VAT need it). Hide it from the POS and lists instead?`)) return;
        try { await api('item_delete', { body: { company_id: CO, item_id: i.id, hide_if_used: true } }); await tItems(); msg($('#i_msg'), `${i.name} is hidden (inactive). Edit it and tick Active to show it again.`, true); } catch (e2) { alert(niceErr(e2)); }
      } else alert(niceErr(err));
    }
  };
  if ($('#i_del')) $('#i_del').onclick = () => { const i = ITEMS.find((x) => x.id === +$('#i_id').value); if (i) delItem(i); };
  $('#i_tb').onclick = (e) => {
    const d = e.target.closest('[data-d]'); if (d) { delItem(ITEMS.find((x) => x.id === +d.dataset.d)); return; }
    const b = e.target.closest('[data-e]'); if (!b) return;
    const i = ITEMS.find((x) => x.id === +b.dataset.e);
    $('#i_h').textContent = 'Edit item: ' + i.name; if ($('#i_del')) $('#i_del').style.display = '';
    $('#i_id').value = i.id; $('#i_sku').value = i.sku; $('#i_name').value = i.name; $('#i_ar').value = i.name_ar || ''; $('#i_cat').value = i.category || '';
    $('#i_uom').value = i.uom; $('#i_price').value = i.price; $('#i_cost').value = i.cost; $('#i_vat').value = i.vat_rate; $('#i_re').value = i.reorder_level;
    $('#i_bc').value = (i.barcodes || []).join(', '); $('#i_act').checked = !!+i.active; $('#i_card').scrollIntoView({ behavior: 'smooth' }); $('#i_name').focus();
  };
  if ($('#i_scan')) $('#i_scan').onclick = () => FlexScan.open((code, say) => {
    const cur = $('#i_bc').value.split(/[\s,]+/).filter(Boolean);
    const other = ITEMS.find((x) => (x.barcodes || []).includes(code) && x.id !== +($('#i_id').value || 0));
    if (other) return say('<b style="color:#b91c1c">' + FlexScan.esc(code) + ' already belongs to ' + FlexScan.esc(other.name) + '.</b>');
    if (!cur.includes(code)) cur.push(code);
    $('#i_bc').value = cur.join(', '); say('Captured <b>' + FlexScan.esc(code) + '</b>. Press Done, then Save item.');
  });
  $('#f').onsubmit = async (e) => {
    e.preventDefault();
    try {
      await api('items_save', { body: { id: +$('#i_id').value || 0, company_id: CO, sku: $('#i_sku').value, name: $('#i_name').value, name_ar: $('#i_ar').value, category: $('#i_cat').value, uom: $('#i_uom').value,
        price: $('#i_price').value, cost: $('#i_cost').value, vat_rate: $('#i_vat').value, reorder_level: $('#i_re').value, barcodes: $('#i_bc').value.split(/[\s,]+/).filter(Boolean), active: $('#i_act').checked } });
      await tItems(); msg($('#i_msg'), 'Saved.', true);
    } catch (err) { msg($('#i_msg'), niceErr(err)); }
  };
}

/* ---------------- Stock ---------------- */
async function tStock() {
  await loadItems();
  const edit = isEditor();
  view().innerHTML = `<div class="card"><div class="row"><div><label>Shop</label><select id="s_shop">${shopOpts(true)}</select></div>
    <div><label>Show</label><select id="s_f"><option value="">All items</option><option value="low">Low stock only</option></select></div>
    <div class="fit"><label>&nbsp;</label><button class="btn sec" id="s_csv" data-ic="download">CSV</button></div></div>
    <div class="hint">Low stock means quantity at or below the item's reorder level, or the default (10) when no level is set.</div>
    <div class="tbl"><table id="s_tb"></table></div></div>
    ${edit ? `<div class="grid g2">
    <div class="card"><h3>Adjust stock / opening stock</h3><form id="a_f">
      <label>Shop</label><select id="a_shop">${shopOpts()}</select>
      <label>Item</label><input id="a_item" list="dl" required placeholder="SKU or name">
      <label>Quantity (use minus to remove)</label><input id="a_qty" type="number" step="0.001" required>
      <label>Type</label><select id="a_type"><option value="adjust">Adjustment (damage, count correction)</option><option value="opening">Opening stock</option></select>
      <label>Note</label><input id="a_note" maxlength="255">
      <div style="margin-top:10px"><button class="btn">Post</button></div><div id="a_msg"></div></form></div>
    <div class="card"><h3>Transfer between shops</h3><form id="t_f">
      <label>From</label><select id="t_from">${shopOpts()}</select>
      <label>To</label><select id="t_to">${shopOpts()}</select>
      <label>Item</label><input id="t_item" list="dl" required placeholder="SKU or name">
      <label>Quantity</label><input id="t_qty" type="number" step="0.001" min="0.001" required>
      <div style="margin-top:10px"><button class="btn">Transfer</button></div><div id="t_msg"></div></form></div></div>`
      : `<div class="card"><span class="tag warn">View only</span> <span class="hint">Stock adjustments and transfers are for owners and managers.</span></div>`}`;
  let rows = [];
  const load = async () => {
    const r = await api('stock_levels', { params: { company_id: CO, shop_id: $('#s_shop').value } });
    rows = r.rows.filter((x) => $('#s_f').value !== 'low' || x.low);

/* Reduce a phone photo to ~1600px JPEG before upload. */
function shrinkImage(file) {
  return new Promise((res, rej) => {
    const im = new Image(), url = URL.createObjectURL(file);
    im.onload = () => {
      const k = Math.min(1, 1600 / Math.max(im.width, im.height)), c = document.createElement('canvas');
      c.width = Math.round(im.width * k); c.height = Math.round(im.height * k);
      c.getContext('2d').drawImage(im, 0, 0, c.width, c.height); URL.revokeObjectURL(url);
      res(c.toDataURL('image/jpeg', 0.8));
    };
    im.onerror = () => rej(new Error('bad_image')); im.src = url;
  });
}

/* ---------------- VAT return ---------------- */
function vatPeriod(kind) {
  const t = today(), y = +t.slice(0, 4), m = +t.slice(5, 7) - 1, pad = (n) => String(n).padStart(2, '0');
  const ymd = (yy, mm, dd) => `${yy}-${pad(mm + 1)}-${pad(dd)}`, last = (yy, mm) => new Date(yy, mm + 1, 0).getDate();
  if (kind === 'lastm') { const d = new Date(y, m - 1, 1); return [ymd(d.getFullYear(), d.getMonth(), 1), ymd(d.getFullYear(), d.getMonth(), last(d.getFullYear(), d.getMonth()))]; }
  if (kind === 'q' || kind === 'lastq') { let q = Math.floor(m / 3) - (kind === 'lastq' ? 1 : 0), yy = y; if (q < 0) { q = 3; yy--; } return [ymd(yy, q * 3, 1), ymd(yy, q * 3 + 2, last(yy, q * 3 + 2))]; }
  return [monthStart(), t];
}

    $('#bh_reg').innerHTML = '<tr><th>Item</th><th>Barcode</th><th>Last label printed</th></tr>' + (reg.map(([i, c]) => { const l = last[i.sku + '|' + (c || i.sku)]; return `<tr><td>${esc(i.sku)} - ${esc(i.name)}</td><td>${c ? esc(c) : '<span class="tag warn">none, SKU is used</span>'}</td><td>${l ? esc(l.printed_at) + ' (' + (+l.copies) + ')' : '-'}</td></tr>`; }).join('') || '<tr><td colspan="3">Nothing matches</td></tr>');
  };
  $('#bh_q').oninput = draw;
  $('#bh_csv').onclick = () => downloadCsv('barcode-history-' + today() + '.csv', [['Printed', 'SKU', 'Item', 'Barcode', 'Labels', 'Size', 'By']].concat(prints.map((r) => [r.printed_at, r.sku, r.name, r.code, r.copies, r.size_key, r.by_name || ''])));
  draw();
}

        $('#sc_save').onclick = () => { if ($('#sc_qty').value === '') { msg($('#sc_msg'), 'Enter the quantity.'); return; } save({ item_id: it.id, qty: $('#sc_qty').value, mode: $('#sc_mode').value }, it.name); };
        $('#sc_qty').onkeydown = (e) => { if (e.key === 'Enter') $('#sc_save').click(); };
      } else {
        form(`<div class="card" style="margin-top:10px"><b>New product</b><div class="hint">Barcode ${esc(code)} is not in your items yet. Add it now.</div>
          <div class="grid g3"><div><label>Name *</label><input id="sc_name" maxlength="200"></div><div><label>Selling price (VAT incl.) *</label><input id="sc_price" type="number" inputmode="decimal" step="0.01" min="0"></div>
          <div><label>Cost (no VAT)</label><input id="sc_cost" type="number" inputmode="decimal" step="0.01" min="0" value="0"></div><div><label>Quantity in stock *</label><input id="sc_qty" type="number" inputmode="decimal" step="0.001" min="0"></div>
          <div><label>Category</label><input id="sc_cat" maxlength="80"></div></div>
          <label style="margin-top:8px"><input type="checkbox" id="sc_auto" style="width:auto" checked> Scan next automatically</label>
          <div class="row" style="margin-top:8px"><div class="fit"><button class="btn" id="sc_save">Add product and stock</button></div></div><div id="sc_msg"></div></div>`);
        $('#sc_name').focus();
        $('#sc_save').onclick = () => { const n = $('#sc_name').value.trim(); if (!n || !$('#sc_price').value || $('#sc_qty').value === '') { msg($('#sc_msg'), 'Name, price and quantity are required.'); return; }
          save({ barcode: code, sku: code, name: n, price: $('#sc_price').value, cost: $('#sc_cost').value || 0, category: $('#sc_cat').value, qty: $('#sc_qty').value, mode: 'set' }, n); };
      }
    } catch (e) { $('#sc_form').innerHTML = `<div class="err">${esc(niceErr(e))}</div>`; }

async function tImport() {

  };

  fill();

  };

      <table><thead><tr><th>Date</th><th>Shop</th><th class="r">Sales</th><th class="r">Cash</th><th class="r">Card</th><th class="r">Expected</th><th class="r">Counted</th><th class="r">Difference</th></tr></thead><tbody>
      ${data.closings.map((c) => `<tr><td>${esc(c.close_date)}</td><td>${esc(c.shop)} (${esc(c.register)})</td><td class="r">${money(c.net_sales)}</td><td class="r">${money(c.cash_sales)}</td><td class="r">${money(c.card_sales)}</td><td class="r">${money(c.expected_cash)}</td><td class="r">${money(c.counted_cash)}</td><td class="r">${money(c.difference)}</td></tr>`).join('') || '<tr><td colspan="8">No cash-ups.</td></tr>'}</tbody></table>
      <div class="foot">Powered by Adnys</div></div>`);
  };
  await load();
}

    $('#n_counts').innerHTML = `<span class="tag bad">${c.new_count} new</span> <span class="tag warn">${c.open_count} open</span> <span class="tag">${c.low_count} low stock</span>`;

        <td><b>${esc(n.title)}</b><div class="hint">${esc(n.detail || '')}</div></td><td>${esc(n.shop || '')}${n.shop_code ? ` (${esc(n.shop_code)})` : ''}</td>

        <td class="hold-actions">${n.status === 'new' ? `<button class="btn sec" data-n="${n.id}" data-a="read">Mark read</button>` : ''}
          ${n.status !== 'resolved' ? `<button class="btn sec" data-n="${n.id}" data-a="resolve">Resolve</button>` : `<button class="btn sec" data-n="${n.id}" data-a="reopen">Reopen</button>`}</td></tr>`).join('') || '<tr><td colspan="7">No alerts.</td></tr>';

    catch (err) { alert(niceErr(err)); }

  await load();
}

/* ---------------- Item master: scan first ----------------
   Scan (barcode gun, camera or typing). A known barcode counts +1 in the list. A new barcode raises a red alert:
   pick the existing item it belongs to (the barcode is remembered on it) or create a new item. Then put the counted
   quantities into stock in one go (add on top, or set the stock to the count). The list stays on this device. */
function itemScanner(redraw) {
  const box = $('#ms_card');
  const LK = () => 'fc_ms_' + CO + '_' + $('#ms_shop').value;
  let list = [], pending = null, camOn = false, hist = [];   // hist: last scans, newest last, for "Undo last scan"
  box.innerHTML = `<h3>Scan items <span class="hint" style="font-weight:400">barcode gun, camera or type</span></h3>
    <div class="hint">Scan a product: a <b>known barcode</b> adds 1 to the list (beep). A <b>new barcode</b> shows a red alert: choose the item it belongs to (the barcode is remembered) or add a new item. Then press <b>Add to stock</b> or <b>Set stock to count</b>. <code>12*code</code> adds 12.</div>
    <div class="row" style="margin-top:8px"><div class="fit" style="min-width:180px"><label>Shop</label><select id="ms_shop">${shopOpts()}</select></div>
      <div style="flex:3"><label>Barcode</label><input id="ms_code" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Scan here (barcode gun types here), or type and press Enter" style="font-size:17px"></div>
      <div class="fit"><button type="button" class="btn" id="ms_cam" data-ic="camera">Camera</button></div></div>
    <div id="ms_alert"></div><div id="ms_last" class="hint" style="margin-top:8px"></div>
    <div class="tbl" style="margin-top:8px"><table id="ms_tb"></table></div>
    <div class="row" style="margin-top:8px"><div class="fit"><button type="button" class="btn sec" id="ms_undo">↶ Undo last scan</button></div><div class="fit"><button type="button" class="btn" id="ms_add">Add to stock</button></div><div class="fit"><button type="button" class="btn sec" id="ms_set">Set stock to count</button></div><div class="fit"><button type="button" class="btn sec" id="ms_clear">Clear list</button></div></div><div id="ms_msg"></div>`;
  hydrateIcons(box);
  const load = () => { try { list = JSON.parse(localStorage.getItem(LK()) || '[]'); } catch (e) { list = []; } };
  const save = () => { try { localStorage.setItem(LK(), JSON.stringify(list)); } catch (e) { /* memory only */ } };
  const drawList = () => {
    const units = list.reduce((a, l) => a + (+l.qty || 0), 0);
    $('#ms_tb').innerHTML = list.length ? `<tr><th>Item</th><th class="r">Stock now</th><th class="r" style="width:110px">Counted</th><th></th></tr>` + list.map((l, i) => `<tr${i === 0 ? ' style="background:var(--soft0,#f8fafc)"' : ''}><td><b>${esc(l.name)}</b><div class="hint">${esc(l.sku)} · ${esc(l.code)}</div></td><td class="r">${l.stock == null ? '…' : qtyTxt(l.stock)}</td>
      <td class="r"><input type="number" min="0" step="0.001" value="${l.qty}" data-q="${i}" style="width:100px;text-align:right"></td><td><button type="button" class="btn sec" data-rm="${i}">✕</button></td></tr>`).join('') + `<tr><td><b>${list.length} item(s)</b></td><td></td><td class="r"><b>${qtyTxt(units)}</b></td><td></td></tr>` : '<tr><td class="hint">Nothing scanned yet.</td></tr>';
    $('#ms_add').disabled = $('#ms_set').disabled = !list.length;
    $('#ms_undo').disabled = !hist.length;
  };
  const stockOf = async (l) => { try { const r = await api('stock_lookup', { params: { shop_id: $('#ms_shop').value, code: l.sku } }); l.stock = r.found ? r.stock : 0; save(); drawList(); } catch (e) { /* offline */ } };
  const count = (it, code, n) => {
    let l = list.find((x) => x.item_id === it.id);
    if (l) { l.qty = Math.round(((+l.qty || 0) + n) * 1000) / 1000; list = [l].concat(list.filter((x) => x !== l)); }
    else { l = { item_id: it.id, name: it.name, sku: it.sku, code, qty: n, stock: null }; list.unshift(l); stockOf(l); }
    hist.push({ item_id: it.id, n }); if (hist.length > 100) hist.shift();
    save(); drawList();
    $('#ms_last').innerHTML = `<span style="color:#15803d;font-size:15px">&#10003; <b>${esc(it.name)}</b> +${qtyTxt(n)} → counted <b>${qtyTxt(l.qty)}</b></span>`;
    if (FlexScan.isOpen()) FlexScan.say(`<b>${esc(it.name)}</b> → ${qtyTxt(l.qty)}`);
  };
  const scan = (raw) => {
    let code = String(raw || '').trim(), n = 1;
    const m = /^(\d+(?:\.\d+)?)\s*[*xX]\s*(.+)$/.exec(code); if (m) { n = +m[1]; code = m[2].trim(); }
    if (!code) return;
    if (pending) { takeAlert('warn'); return; }   // finish the red alert first
    const it = findItem(code);
    if (it) { takeAlert('ok'); count(it, code, n); return; }
    newBarcode(code, n);
  };
  const newBarcode = (code, n) => {
    takeAlert('new');
    const reopen = camOn && FlexScan.isOpen(); if (reopen) FlexScan.close();
    pending = code;
    const okCode = /^[A-Za-z0-9._\-]{1,64}$/.test(code);
    $('#ms_alert').innerHTML = `<div class="card dupwarn" style="margin-top:10px"><b class="dt" style="font-size:18px">&#9888; New barcode ${esc(code)}</b>
      ${okCode ? '' : '<div class="err">This code has characters a barcode cannot have (only letters, digits and . _ -). Check the label.</div>'}
      <div class="hint">Not in your items yet. Is it one of your items (for example from your old stock list)? Find it so this barcode is remembered on it. Otherwise add it as a new item.</div>
      <div class="grid g2" style="margin-top:6px"><div><label>Find existing item (name or code)</label><input id="nb_q" autocomplete="off" placeholder="e.g. perfume"><div id="nb_res" style="max-height:260px;overflow:auto;margin-top:4px"></div></div>
      <div><label>Or new item</label><div class="grid g2"><div><label>Name *</label><input id="nb_name" maxlength="200"></div><div><label>Unit</label><input id="nb_uom" value="Nos" maxlength="10"></div>
        <div><label>Cost (no VAT)</label><input id="nb_cost" type="number" step="0.01" min="0" value="0"></div><div><label>Selling price (VAT incl.) *</label><input id="nb_price" type="number" step="0.01" min="0"></div></div>
        <div class="row" style="margin-top:8px"><div class="fit"><button type="button" class="btn" id="nb_new">Add new item</button></div></div></div></div>
      <div class="row" style="margin-top:8px"><div class="fit"><button type="button" class="btn sec" id="nb_skip">Skip this barcode</button></div></div><div class="err" id="nb_err"></div></div>`;
    $('#nb_q').focus();
    const close = () => { pending = null; $('#ms_alert').innerHTML = ''; if (reopen) setTimeout(cam, 250); else $('#ms_code').focus(); };
    const results = (q) => {
      q = q.trim().toLowerCase(); const q2 = q.replace(/[^a-z0-9._\-\/]+/g, '-');
      const r = q.length < 2 ? [] : ITEMS.filter((i) => i.name.toLowerCase().includes(q) || i.sku.toLowerCase().includes(q) || i.sku.toLowerCase().includes(q2)).slice(0, 30);
      $('#nb_res').innerHTML = r.map((i) => `<button type="button" class="btn sec" data-li="${i.id}" style="display:block;width:100%;text-align:left;margin:3px 0;padding:8px 10px">${esc(i.name)} <span class="hint">${esc(i.sku)} · ${money(i.price)}${(i.barcodes || []).length ? ' · has barcode ' + esc(i.barcodes[0]) : ''}</span></button>`).join('') || (q.length < 2 ? '' : '<div class="hint">Nothing found. Add it as a new item.</div>');
    };
    $('#nb_q').oninput = (e) => results(e.target.value);
    $('#nb_res').onclick = async (e) => {
      const b = e.target.closest('[data-li]'); if (!b) return;
      const it = ITEMS.find((x) => x.id === +b.dataset.li);
      if (!okCode) return;
      try { await api('item_barcode_link', { body: { company_id: CO, item_id: it.id, barcode: code } }); it.barcodes = (it.barcodes || []).concat(code); takeAlert('ok'); count(it, code, n); close(); redraw(); }
      catch (er) { $('#nb_err').textContent = niceErr(er); }
    };
    $('#nb_new').onclick = async () => {
      const name = $('#nb_name').value.trim(), price = $('#nb_price').value;
      if (!name || price === '') { $('#nb_err').textContent = 'Type the name and the selling price.'; return; }
      if (!okCode) return;
      const skuOk = /^[A-Za-z0-9._\-\/]{1,40}$/.test(code) && !ITEMS.some((i) => i.sku.toLowerCase() === code.toLowerCase());
      try {
        const r = await api('items_save', { body: { company_id: CO, sku: skuOk ? code : 'BC' + code.slice(-30) + '-' + Date.now().toString(36).slice(-3), name, uom: $('#nb_uom').value || 'pc', cost: $('#nb_cost').value || 0, price, vat_rate: 5, reorder_level: 0, barcodes: [code], active: true } });
        await loadItems(); const it = ITEMS.find((x) => x.id === r.id); takeAlert('ok'); count(it, code, n); close(); redraw();
      } catch (er) { $('#nb_err').textContent = niceErr(er); }
    };
    $('#nb_skip').onclick = close;
  };
  const cam = () => { camOn = true; FlexScan.open((code) => scan(code), { gap: 900 }); const d = document.querySelector('dialog[open]'); if (d) d.addEventListener('close', () => { if (!pending) camOn = false; }, { once: true }); };
  $('#ms_cam').onclick = cam;
  $('#ms_code').onkeydown = (e) => { if (e.key === 'Enter') { e.preventDefault(); scan(e.target.value); e.target.value = ''; } };
  $('#ms_shop').onchange = () => { hist = []; load(); drawList(); list.forEach(stockOf); };
  $('#ms_tb').oninput = (e) => { const q = e.target.closest('[data-q]'); if (q) { list[+q.dataset.q].qty = Math.max(0, +q.value || 0); save(); } };
  $('#ms_tb').onclick = (e) => { const r = e.target.closest('[data-rm]'); if (r) { const gone = list.splice(+r.dataset.rm, 1)[0]; hist = hist.filter((h) => !gone || h.item_id !== gone.item_id); save(); drawList(); } };
  // Undo takes back exactly the last scan (its quantity); press again for the one before. Nothing is posted to stock until Add / Set.
  $('#ms_undo').onclick = () => {
    const h = hist.pop(); if (!h) return;
    const l = list.find((x) => x.item_id === h.item_id);
    if (l) { l.qty = Math.round(((+l.qty || 0) - h.n) * 1000) / 1000; if (l.qty <= 0.0005) list = list.filter((x) => x !== l); }
    save(); drawList();
    $('#ms_last').innerHTML = l ? `<span style="font-size:15px">↶ Undone: <b>${esc(l.name)}</b> −${qtyTxt(h.n)} → counted <b>${qtyTxt(Math.max(0, l.qty))}</b></span>` : '';
    $('#ms_code').focus();
  };
  $('#ms_clear').onclick = () => { if (list.length && !confirm('Clear the scanned list? Stock is not changed.')) return; list = []; hist = []; save(); drawList(); $('#ms_last').innerHTML = ''; };
  const post = async (mode) => {
    const shop = shopsOf().find((s) => s.id === +$('#ms_shop').value);
    const units = list.reduce((a, l) => a + (+l.qty || 0), 0);
    if (!confirm(mode === 'add' ? `Add ${qtyTxt(units)} unit(s) of ${list.length} item(s) to the stock of ${shop ? shop.name : 'this shop'}?` : `Set the stock of these ${list.length} item(s) in ${shop ? shop.name : 'this shop'} to the counted quantity?`)) return;
    try {
      const r = await api('stock_count_batch', { body: { shop_id: +$('#ms_shop').value, mode, lines: list.map((l) => ({ item_id: l.item_id, qty: +l.qty || 0 })) } });
      list = []; hist = []; save(); drawList(); $('#ms_last').innerHTML = '';
      $('#ms_msg').className = 'okmsg'; $('#ms_msg').innerHTML = `Stock updated for ${r.lines.length} item(s): ` + r.lines.slice(0, 8).map((x) => `${esc(x.name)} ${qtyTxt(x.was)} → <b>${qtyTxt(x.now)}</b>`).join(', ') + (r.lines.length > 8 ? ' …' : '');
    } catch (e) { msg($('#ms_msg'), niceErr(e)); }
  };
  $('#ms_add').onclick = () => post('add');
  $('#ms_set').onclick = () => post('set');
  load(); drawList(); list.forEach((l) => { if (l.stock == null) stockOf(l); });
  $('#ms_code').focus();
}

/* ---------------- Quick item window (from Purchases) ----------------
   A code or name that is not an item yet: add it on the spot, or say which existing item it is (the barcode is
   remembered), then go straight back to the bill. Resolves with the item, or null when cancelled. */
function quickItem(opts) {
  opts = opts || {};
  const code = String(opts.code || '').trim();
  const codeOk = /^[A-Za-z0-9._\-]{1,64}$/.test(code);
  const looksCode = codeOk && !/\s/.test(code) && (/\d/.test(code) || code.length <= 12);
  return new Promise((resolve) => {
    takeAlert('new');
    const d = document.createElement('dialog'); d.style.width = 'min(640px,96vw)';
    d.innerHTML = `<form method="dialog"><h3 style="margin:0 0 4px;color:#b91c1c">&#9888; ${code ? (looksCode ? 'New code ' : 'New item ') + esc(code) : 'New item'}</h3>
      <div class="hint">Not in your items yet. Add it now and it goes straight onto the bill.${looksCode ? ' Or, if it is an item you already have, find it so this barcode is remembered on it.' : ''}</div>
      ${looksCode ? `<details style="margin-top:8px"><summary><b>It is an existing item</b> (add this barcode to it)</summary><input id="qi_q" type="search" placeholder="Find by name or code" autocomplete="off" style="margin-top:6px"><div id="qi_res" style="max-height:220px;overflow:auto"></div></details>` : ''}
      <div class="grid g2" style="margin-top:8px">
        <div><label>Item code (SKU) *</label><input id="qi_sku" maxlength="40" required value="${esc(looksCode && /^[A-Za-z0-9._\-\/]{1,40}$/.test(code) && !findItem(code) ? code : '')}"></div>
        <div><label>Name *</label><input id="qi_name" maxlength="200" required value="${esc(looksCode ? '' : code)}"></div>
        <div><label>Barcode</label><input id="qi_bc" maxlength="64" value="${esc(looksCode ? code : '')}"></div>
        <div><label>Unit</label><input id="qi_uom" maxlength="10" value="Nos"></div>
        <div><label>Cost (no VAT) *</label><input id="qi_cost" type="number" step="0.0001" min="0" required value="${opts.cost || ''}"></div>
        <div><label>Selling price (VAT incl.) *</label><input id="qi_price" type="number" step="0.01" min="0" required></div>
        <div><label>VAT %</label><input id="qi_vat" type="number" step="0.01" min="0" value="${opts.vat ?? 5}"></div>
        <div><label>Category</label><input id="qi_cat" maxlength="80"></div></div>
      <div class="err" id="qi_err"></div>
      <div class="row" style="margin-top:10px"><div class="fit"><button class="btn" id="qi_ok">Save item and add to bill</button></div><div class="fit"><button type="button" class="btn sec" id="qi_no">Cancel</button></div></div></form>`;
    document.body.appendChild(d); d.showModal();
    const end = (it) => { d.close(); d.remove(); resolve(it || null); };
    $('#qi_no', d).onclick = () => end(null);
    d.addEventListener('cancel', (e) => { e.preventDefault(); end(null); });
    (looksCode ? $('#qi_name', d) : $('#qi_sku', d)).focus();
    if (!$('#qi_sku', d).value && !looksCode) $('#qi_sku', d).value = code.toUpperCase().replace(/[^A-Z0-9]+/g, '-').replace(/^-|-$/g, '').slice(0, 20);
    if ($('#qi_q', d)) {
      $('#qi_q', d).oninput = (e) => {
        const q = e.target.value.trim().toLowerCase(), q2 = q.replace(/[^a-z0-9._\-\/]+/g, '-');
        const r = q.length < 2 ? [] : ITEMS.filter((i) => i.name.toLowerCase().includes(q) || i.sku.toLowerCase().includes(q) || i.sku.toLowerCase().includes(q2)).slice(0, 25);
        $('#qi_res', d).innerHTML = r.map((i) => `<button type="button" class="btn sec" data-qi="${i.id}" style="display:block;width:100%;text-align:left;margin:3px 0;padding:7px 10px">${esc(i.name)} <span class="hint">${esc(i.sku)} · cost ${money(i.cost)}</span></button>`).join('') || (q.length < 2 ? '' : '<div class="hint">Nothing found.</div>');
      };
      $('#qi_res', d).onclick = async (e) => {
        const b = e.target.closest('[data-qi]'); if (!b) return;
        const it = ITEMS.find((x) => x.id === +b.dataset.qi);
        try { await api('item_barcode_link', { body: { company_id: CO, item_id: it.id, barcode: code } }); it.barcodes = (it.barcodes || []).concat(code); takeAlert('ok'); end(it); }
        catch (er) { $('#qi_err', d).textContent = niceErr(er); }
      };
    }
    $('form', d).onsubmit = async (e) => {
      e.preventDefault();
      const sku = $('#qi_sku', d).value.trim(), bc = $('#qi_bc', d).value.trim();
      if (findItem(sku)) { $('#qi_err', d).textContent = 'Item code ' + sku + ' is already used by ' + findItem(sku).name + '.'; return; }
      $('#qi_ok', d).disabled = true;
      try {
        const r = await api('items_save', { body: { company_id: CO, sku, name: $('#qi_name', d).value, uom: $('#qi_uom', d).value || 'pc', category: $('#qi_cat', d).value,
          cost: $('#qi_cost', d).value || 0, price: $('#qi_price', d).value, vat_rate: $('#qi_vat', d).value || 0, reorder_level: 0, barcodes: bc ? [bc] : [], active: true } });
        await loadItems(); takeAlert('ok'); end(ITEMS.find((x) => x.id === r.id));
      } catch (er) { $('#qi_err', d).textContent = niceErr(er); $('#qi_ok', d).disabled = false; }
    };
  });
}

        <td class="hold-actions">${+u.can_edit ? `<button class="btn sec" data-ue="${u.id}">Edit</button>` : ''}${+u.can_reset ? `<button class="btn sec" data-ur="${u.id}">Reset password</button>` : ''}
          ${+u.can_toggle ? `<button class="btn sec" data-ut="${u.id}">${+u.active ? 'Disable' : 'Enable'}</button>` : ''}${+u.is_primary ? '<span class="tag ok">primary owner</span>' : ''}</td></tr>`).join('') || '<tr><td colspan="7">No users.</td></tr>';
  };
  draw();
  const clear = () => { $('#u_f').reset(); $('#u_id').value = ''; $('#u_act').checked = true; };
  $('#u_new').onclick = clear;
  $('#u_tb').onclick = async (e) => {
    const ed = e.target.closest('[data-ue]'), rs = e.target.closest('[data-ur]'), tg = e.target.closest('[data-ut]');
    if (ed) {
      const u = d.users.find((x) => x.id === +ed.dataset.ue);
      $('#u_id').value = u.id; $('#u_name').value = u.name; $('#u_email').value = u.email || ''; $('#u_role').value = u.role;
      $('#u_shop').value = u.shop_id || ''; $('#u_pw').value = ''; $('#u_act').checked = !!+u.active;
      scrollTo({ top: 0, behavior: 'smooth' });
    }
    if (rs) {
      if (!confirm('Reset this password? They will be signed out.')) return;
      try { showCreds('New password', await api('user_reset', { body: { user_id: +rs.dataset.ur } })); } catch (err) { alert(niceErr(err)); }
    }
    if (tg) {
      const u = d.users.find((x) => x.id === +tg.dataset.ut);
      try {
        await api('user_save', { body: { id: u.id, name: u.name, email: u.email || '', role: u.role, shop_id: u.shop_id || '', active: +u.active ? 0 : 1 } });
        await tUsers();
      } catch (err) { alert(niceErr(err)); }
    }
  };
  $('#u_f').onsubmit = async (e) => {
    e.preventDefault();
    try {
      const r = await api('user_save', { body: { id: +$('#u_id').value || 0, name: $('#u_name').value, email: $('#u_email').value, role: $('#u_role').value, shop_id: $('#u_shop').value || '', password: $('#u_pw').value, active: $('#u_act').checked } });
      await tUsers();
      if (r.password) showCreds('User saved. Give these to the user.', r); else msg($('#u_msg'), 'Saved.', true);
    } catch (err) { msg($('#u_msg'), niceErr(err)); }
  };
}

/* ---------------- boot ---------------- */
startPage(() => {
  const cs = S.org.companies || [];
  $('#co').innerHTML = cs.map((c) => `<option value="${c.id}">${esc(c.name)}</option>`).join('');
  CO = cs.length ? cs[0].id : 0;
  if (!CO) { view().innerHTML = '<div class="card">No company is set up yet.</div>'; return; }
  const h = location.hash.slice(1);
  if (TAB_DEFS[h] && TAB_DEFS[h].roles.includes(S.user.role)) TAB = h;
  const bw = S.user.role === 'stocker';   // stocker phones stay black and white, also on the next sign-in screen
  try { if (bw) localStorage.setItem('fc_bw', '1'); else localStorage.removeItem('fc_bw'); } catch (e) { /* ignore */ }
  document.documentElement.classList.toggle('bw', bw);
  if (bw) { document.documentElement.dataset.theme = 'light'; const m = document.querySelector('meta[name="theme-color"]'); if (m) m.content = '#000000'; }
  if (S.user.role === 'stocker') { location.replace('../stock/'); return; }   // stockers use the Stock take app
  show();
}, ['owner', 'manager', 'accountant', 'purchase', 'stocker']);
</script>
